name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # SKIP_SMOKE=1 keeps the integration smoke describe skipped in CI.
      # The smoke suite spawns the FuFirE python mock-server which currently
      # surfaces pre-existing FuFirE OpenAPI gaps (empty components.schemas).
      # Smoke runs locally + in Sprint 5 (live API) once schemas are populated.
      - run: SKIP_SMOKE=1 bun run test
